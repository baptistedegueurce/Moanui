name: Exécutable Windows

# Construit Moanui-windows.zip (aucune installation ni droit administrateur requis) et le publie dans
# Releases à chaque push sur main ou claude/** (outils/notes_de_version.py) :
# - __version__ sans « .dev » et étiquette absente -> version stable v<version> (« Latest ») ;
# - sinon -> pré-version v<base>-dev.<n° de commit>, notes = CHANGELOG « Non publié » + commits.
# Un commit déjà étiqueté (ex. main avancé jusqu'à la branche de travail) n'est pas republié.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "claude/**"]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        shell: pwsh
        run: |
          git fetch --tags --force
          python outils/notes_de_version.py version
          $tag = ((python outils/notes_de_version.py version) | Select-String '^tag=').ToString().Substring(4)
          $cible = if (git tag --list $tag) { git rev-list -n 1 $tag } else { "" }
          if ($cible -and $cible -ne (git rev-parse HEAD)) { throw "L'étiquette $tag existe déjà sur un autre commit ($cible)" }
          python outils/notes_de_version.py stamp
          $deja = git tag --points-at HEAD --list "v*"
          if ($deja) { "publier=false" >> $env:GITHUB_OUTPUT; "Déjà publié : $deja" } else { "publier=true" >> $env:GITHUB_OUTPUT }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: pip install "./backend[dev]" pyinstaller
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Extension spatiale DuckDB (cartographie, embarquée pour fonctionner hors ligne)
        run: python packaging/extension_spatiale.py

      - name: Exécutable
        run: pyinstaller packaging/moanui.spec --noconfirm --distpath dist --workpath build

      - name: Vérification au démarrage
        shell: pwsh
        run: |
          # sans l'extension installée dans le profil : seule la copie embarquée doit servir
          Remove-Item -Recurse -Force "$env:USERPROFILE\.duckdb" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\Moanui\Moanui.exe" -ArgumentList "--no-browser","--no-pause","--port","8799","--home","$env:RUNNER_TEMP\moanui-test" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/health"; if ($r.ok) { $ok = $true; $health = $r; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "Moanui.exe ne répond pas" }
          $health | ConvertTo-Json
          if ($health.cartographie -ne "embarquee") { throw "Extension spatiale embarquée introuvable" }
          if ($health.version -ne "${{ steps.v.outputs.version }}") { throw "Version affichée $($health.version) au lieu de ${{ steps.v.outputs.version }}" }

      - name: Archive
        shell: pwsh
        run: |
          Copy-Item packaging\LISEZMOI.txt dist\Moanui\
          Compress-Archive -Path dist\Moanui -DestinationPath Moanui-windows.zip

      - name: Vérification comme un utilisateur (zip extrait, double-clic, dossier par défaut)
        shell: pwsh
        run: |
          # dossier avec espaces et accents, espace de travail par défaut (%LOCALAPPDATA%\Moanui), port par défaut
          $d = Join-Path $env:RUNNER_TEMP "Téléchargements utilisateur"
          Expand-Archive Moanui-windows.zip -DestinationPath $d -Force
          $exe = Join-Path $d "Moanui\Moanui.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--no-pause" -WorkingDirectory $d -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { $r = Invoke-RestMethod "http://127.0.0.1:8765/api/health"; if ($r.ok) { $ok = $true; break } } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-ChildItem -Recurse -Filter moanui-erreur.log $d, "$env:LOCALAPPDATA\Moanui" -ErrorAction SilentlyContinue | Get-Content
          if (-not $ok) { throw "Moanui.exe ne démarre pas depuis le zip extrait (code $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: Moanui-windows
          path: Moanui-windows.zip

      - name: Notes de version
        if: github.event_name == 'push' && steps.v.outputs.publier == 'true'
        run: python outils/notes_de_version.py notes notes.md

      - name: Release
        if: github.event_name == 'push' && steps.v.outputs.publier == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Moanui ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: Moanui-windows.zip
          prerelease: ${{ steps.v.outputs.kind == 'dev' }}
          make_latest: ${{ steps.v.outputs.kind == 'stable' }}
