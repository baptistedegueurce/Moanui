name: Exécutable Windows

# Construit Moanui-windows.zip (aucune installation ni droit administrateur requis).
# Manuel : onglet Actions > « Exécutable Windows » > Run workflow (zip dans les artefacts).
# Version : pousser une étiquette vX.Y.Z publie le zip dans une Release GitHub.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]
    # reconstruit aussi quand l'empaquetage ou les dépendances changent
    paths:
      - "packaging/**"
      - ".github/workflows/windows.yml"
      - "backend/pyproject.toml"
      - "frontend/package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: pip install "./backend[dev]" pyinstaller
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Exécutable
        run: pyinstaller packaging/moanui.spec --noconfirm --distpath dist --workpath build

      - name: Vérification au démarrage
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Moanui\Moanui.exe" -ArgumentList "--no-browser","--port","8799","--home","$env:RUNNER_TEMP\moanui-test" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/health"; if ($r.ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "Moanui.exe ne répond pas" }

      - name: Archive
        shell: pwsh
        run: |
          Copy-Item packaging\LISEZMOI.txt dist\Moanui\
          Compress-Archive -Path dist\Moanui -DestinationPath Moanui-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Moanui-windows
          path: Moanui-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Moanui-windows.zip
          generate_release_notes: true
