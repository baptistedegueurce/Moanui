name: Exécutable Windows

# Construit Moanui-windows.zip (aucune installation ni droit administrateur requis) et le publie dans
# Releases à chaque push sur main ou claude/** (outils/notes_de_version.py) :
# - __version__ sans « .dev » et étiquette absente -> version stable v<version> (« Latest ») ;
# - sinon -> pré-version v<base>-dev.<n° de commit>, notes = CHANGELOG « Non publié » + commits.
# Un commit déjà étiqueté (ex. main avancé jusqu'à la branche de travail) n'est pas republié.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "claude/**"]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        shell: pwsh
        run: |
          git fetch --tags --force
          python outils/notes_de_version.py version
          $tag = ((python outils/notes_de_version.py version) | Select-String '^tag=').ToString().Substring(4)
          $cible = if (git tag --list $tag) { git rev-list -n 1 $tag } else { "" }
          if ($cible -and $cible -ne (git rev-parse HEAD)) { throw "L'étiquette $tag existe déjà sur un autre commit ($cible)" }
          python outils/notes_de_version.py stamp
          $deja = git tag --points-at HEAD --list "v*"
          if ($deja) { "publier=false" >> $env:GITHUB_OUTPUT; "Déjà publié : $deja" } else { "publier=true" >> $env:GITHUB_OUTPUT }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: pip install "./backend[dev]" pyinstaller
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Extension spatiale DuckDB (cartographie, embarquée pour fonctionner hors ligne)
        run: python packaging/extension_spatiale.py

      - name: Exécutable
        run: pyinstaller packaging/moanui.spec --noconfirm --distpath dist --workpath build

      - name: Vérification au démarrage
        shell: pwsh
        run: |
          # sans l'extension installée dans le profil : seule la copie embarquée doit servir
          Remove-Item -Recurse -Force "$env:USERPROFILE\.duckdb" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\Moanui\Moanui.exe" -ArgumentList "--no-browser","--no-pause","--port","8799","--home","$env:RUNNER_TEMP\moanui-test" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/health"; if ($r.ok) { $ok = $true; $health = $r; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "Moanui.exe ne répond pas" }
          $health | ConvertTo-Json
          if ($health.cartographie -ne "embarquee") { throw "Extension spatiale embarquée introuvable" }
          if ($health.version -ne "${{ steps.v.outputs.version }}") { throw "Version affichée $($health.version) au lieu de ${{ steps.v.outputs.version }}" }

      - name: Archive
        shell: pwsh
        run: |
          Copy-Item packaging\LISEZMOI.txt dist\Moanui\
          Compress-Archive -Path dist\Moanui -DestinationPath Moanui-windows.zip

      - name: Vérification comme un utilisateur (zip extrait, double-clic, dossier par défaut)
        shell: pwsh
        run: |
          # dossier avec espaces et accents, espace de travail par défaut (%LOCALAPPDATA%\Moanui), port par défaut
          $d = Join-Path $env:RUNNER_TEMP "Téléchargements utilisateur"
          Expand-Archive Moanui-windows.zip -DestinationPath $d -Force
          $exe = Join-Path $d "Moanui\Moanui.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--no-pause" -WorkingDirectory $d -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { $r = Invoke-RestMethod "http://127.0.0.1:8765/api/health"; if ($r.ok) { $ok = $true; break } } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-ChildItem -Recurse -Filter moanui-erreur.log $d, "$env:LOCALAPPDATA\Moanui" -ErrorAction SilentlyContinue | Get-Content
          if (-not $ok) { throw "Moanui.exe ne démarre pas depuis le zip extrait (code $($p.ExitCode))" }

      - name: Installateur (Inno Setup, par utilisateur, sans droits administrateur)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=${{ steps.v.outputs.version }}" packaging\moanui.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }
          Get-Item Moanui-installation.exe | Select-Object Name, Length

      - name: Vérification de l'installateur (fichier marqué « téléchargé depuis Internet »)
        timeout-minutes: 10
        shell: pwsh
        run: |
          Copy-Item Moanui-installation.exe "$env:RUNNER_TEMP\Moanui-installation.exe"
          $inst = "$env:RUNNER_TEMP\Moanui-installation.exe"
          Set-Content -Path $inst -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          # lancement direct (sans ShellExecute : pas de fenêtre d'avertissement en session non interactive)
          $si = New-Object System.Diagnostics.ProcessStartInfo -Property @{
            FileName = $inst; Arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /LOG=`"$env:RUNNER_TEMP\inst.log`""
            UseShellExecute = $false }
          $p = [System.Diagnostics.Process]::Start($si)
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Get-Content "$env:RUNNER_TEMP\inst.log" -ErrorAction SilentlyContinue; throw "Installation bloquée" }
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\inst.log"; throw "Installation silencieuse en échec (code $($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\Moanui"
          $dll = Get-ChildItem "$app\_internal" -Filter "python3*.dll" | Select-Object -First 1
          if (-not $dll) { throw "python3xx.dll absente de $app" }
          if (Get-Item $dll.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "$($dll.Name) porte la marque Internet" }
          $exe = Start-Process -FilePath "$app\Moanui.exe" -ArgumentList "--no-browser","--no-pause","--port","8790" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if ($exe.HasExited) { break }
            try { $r = Invoke-RestMethod "http://127.0.0.1:8790/api/health"; if ($r.ok) { $ok = $true; break } } catch {}
          }
          if (-not $exe.HasExited) { Stop-Process -Id $exe.Id -Force }
          if (-not $ok) { throw "Moanui installé ne démarre pas" }
          if ($r.version -ne "${{ steps.v.outputs.version }}") { throw "Version installée $($r.version)" }
          # exports Word et PDF depuis l'exe (polices, conversion des figures, modèles Word embarqués)
          $exe = Start-Process -FilePath "$app\Moanui.exe" -ArgumentList "--no-browser","--no-pause","--port","8791","--home","$env:RUNNER_TEMP\moanui-export" -PassThru
          $B = "http://127.0.0.1:8791"
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 2; try { if ((Invoke-RestMethod "$B/api/health").ok) { break } } catch {} }
          $body = @{ username = "admin"; display_name = "Test"; password = "motdepasse1"; structure_name = "Structure test"; structure_short_name = "ST" } | ConvertTo-Json
          Invoke-RestMethod "$B/api/setup" -Method Post -ContentType "application/json" -Body $body -SessionVariable s | Out-Null
          $form = @{ file = Get-Item "exemples\donnees_demo\suivi_casiers_homard.csv" }
          $ds = Invoke-RestMethod "$B/api/datasets/import" -Method Post -Form $form -WebSession $s
          $q = @{ analyse = "glm"; variables = @{ y = "nb_homards"; x = @("zone"); effort = "nb_casiers" } } | ConvertTo-Json -Depth 4
          foreach ($fmt in @("pdf", "docx")) {
            $out = "$env:RUNNER_TEMP\fiche.$fmt"
            Invoke-WebRequest "$B/api/datasets/$($ds.id)/stats/method.$fmt" -Method Post -ContentType "application/json" -Body $q -WebSession $s -OutFile $out
            $head = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($out)[0..3])
            "$fmt : $((Get-Item $out).Length) octets, début $head"
            if (($fmt -eq "pdf" -and $head -ne "%PDF") -or ($fmt -eq "docx" -and $head.Substring(0,2) -ne "PK")) { Stop-Process -Id $exe.Id -Force; throw "Export $fmt invalide" }
            if ((Get-Item $out).Length -lt 20000) { Stop-Process -Id $exe.Id -Force; throw "Export $fmt trop petit (figures absentes ?)" }
          }
          Stop-Process -Id $exe.Id -Force
          Start-Sleep -Seconds 2
          $su = New-Object System.Diagnostics.ProcessStartInfo -Property @{
            FileName = "$app\unins000.exe"; Arguments = "/VERYSILENT /SUPPRESSMSGBOXES"; UseShellExecute = $false }
          $un = [System.Diagnostics.Process]::Start($su)
          [void]$un.WaitForExit(120000)
          "Désinstallation lancée"

      - uses: actions/upload-artifact@v4
        with:
          name: Moanui-windows
          path: |
            Moanui-windows.zip
            Moanui-installation.exe

      - name: Notes de version
        if: github.event_name == 'push' && steps.v.outputs.publier == 'true'
        run: python outils/notes_de_version.py notes notes.md

      - name: Guide utilisateur (Word et PDF, construits depuis docs/guide)
        if: github.event_name == 'push' && steps.v.outputs.publier == 'true'
        run: |
          python outils/construire_guide.py
          Copy-Item docs/guide/Moanui-guide.pdf Moanui-guide.pdf
          Copy-Item docs/guide/Moanui-guide.docx Moanui-guide.docx

      - name: Release
        if: github.event_name == 'push' && steps.v.outputs.publier == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Moanui ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            Moanui-installation.exe
            Moanui-windows.zip
            Moanui-guide.pdf
            Moanui-guide.docx
          prerelease: ${{ steps.v.outputs.kind == 'dev' }}
          make_latest: ${{ steps.v.outputs.kind == 'stable' }}
