name: Exécutable Windows

# Construit Moanui-windows.zip (aucune installation ni droit administrateur requis).
# Chaque push construit le zip (onglet Actions > « Exécutable Windows » > artefact Moanui-windows).
# Version : pousser une étiquette vX.Y.Z publie le zip dans une Release GitHub.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: pip install "./backend[dev]" pyinstaller
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Extension spatiale DuckDB (cartographie, embarquée pour fonctionner hors ligne)
        run: python packaging/extension_spatiale.py

      - name: Exécutable
        run: pyinstaller packaging/moanui.spec --noconfirm --distpath dist --workpath build

      - name: Vérification au démarrage
        shell: pwsh
        run: |
          # sans l'extension installée dans le profil : seule la copie embarquée doit servir
          Remove-Item -Recurse -Force "$env:USERPROFILE\.duckdb" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\Moanui\Moanui.exe" -ArgumentList "--no-browser","--port","8799","--home","$env:RUNNER_TEMP\moanui-test" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/health"; if ($r.ok) { $ok = $true; $health = $r; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "Moanui.exe ne répond pas" }
          $health | ConvertTo-Json
          if ($health.cartographie -ne "embarquee") { throw "Extension spatiale embarquée introuvable" }

      - name: Archive
        shell: pwsh
        run: |
          Copy-Item packaging\LISEZMOI.txt dist\Moanui\
          Compress-Archive -Path dist\Moanui -DestinationPath Moanui-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Moanui-windows
          path: Moanui-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Moanui-windows.zip
          generate_release_notes: true
